<!DOCTYPE html>
<html lang="es">
<head>

    <title>ASISTENTE DE EVALUACIÓN CREDITICIA · DirectLine</title>

    <meta charset="utf-8" />
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.css">
    <link rel="stylesheet" href="/style/style.css?v=2">
    <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

    <style>
        .chat-app_content {
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        #webchat {
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        .dl-error {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.6em;
            color: var(--celeste-oscuro);
            text-align: center;
            padding: 2em;
            font-size: 0.85em;
            background: var(--celeste-fondo);
            z-index: 9999;
        }

        .dl-error i {
            font-size: 2em;
            color: var(--celeste-fuerte);
        }

        .dl-error p {
            margin: 0;
            max-width: 300px;
            line-height: 1.45;
        }
    </style>
</head>

<body>

    <div id="chat-app" class="chat-app">

        <div class="chat-app_toggle toggle">

            <div class="icon send">

                <i class="fas fa-paper-plane"></i>

            </div>

            <div class="icon open">

                <i class="fas fa-comment"></i>

            </div>

        </div>

        <div class="chat-app_head">

            <div class="close hide"></div>

        </div>

        <div class="chat-app_box">

            <div class="chat-app_header">

                <div class="branding">

                    <div class="content">

                        <p class="title">EVALUACIÓN CREDITICIA</p>

                        <p class="subtitle">Asistente IA · DirectLine</p>

                    </div>

                </div>

            </div>

            <div class="chat-app_content" id="chat-app_content">

                <div id="webchat" role="main"></div>

                <div id="dl-error" class="dl-error hide">

                    <i class="fas fa-plug"></i>

                    <p><strong>Canal DirectLine no disponible</strong></p>

                </div>

                <div id="dl-typing" class="dl-typing hide">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>

            </div>

            <div class="chat-app_attachments" id="chat-app_attachments"></div>

            <div class="chat-app_footer">

                <button id="attach-button" class="attach-button" aria-label="Adjuntar documento" title="Adjuntar documento (PDF o imagen)">

                    <i class="fas fa-paperclip"></i>

                </button>

                <input type="text" id="chat-input" placeholder="Escribe tu consulta..."
                       autocomplete="off" maxlength="4000" aria-label="Mensaje" />

                <button id="send-button" class="send-button" aria-label="Enviar">

                    <i class="fas fa-paper-plane"></i>

                </button>

            </div>

        </div>

    </div>

    <input type="file" id="file-input" accept="application/pdf,.pdf,image/png,.png,image/jpeg,.jpg,.jpeg" multiple hidden />

    <script src="/js/directline.js?v=6"></script>
</body>
</html>
